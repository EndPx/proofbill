<svg xmlns="http://www.w3.org/2000/svg" width="920" height="675" viewBox="0 0 920 675"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#526459"/></marker></defs><rect width="920" height="100%" fill="#ffffff"/><text x="38" y="52.0" fill="#25392e" font-family="Arial, sans-serif" font-size="28">One permission. A traceable purchase.</text><text x="38" y="85.0" fill="#526459" font-family="Arial, sans-serif" font-size="15">ProofBill / product journey</text><path d="M460,215 L460,245" fill="none" stroke="#526459" stroke-width="2" marker-end="url(#arrow)"/><path d="M460,351 L460,381" fill="none" stroke="#526459" stroke-width="2" marker-end="url(#arrow)"/><path d="M460,487 L460,517" fill="none" stroke="#526459" stroke-width="2" marker-end="url(#arrow)"/><rect x="54" y="115" width="812" height="96" rx="14" fill="#e2f9ec" stroke="#b9cdc0" stroke-width="1.5"/><text x="74" y="153.0" fill="#25392e" font-family="Arial, sans-serif" font-size="22">01  Fund the pass</text><text x="74" y="183.0" fill="#526459" font-family="Arial, sans-serif" font-size="16">Choose total budget, optional ceiling, expiry and payment mode.</text><rect x="54" y="251" width="812" height="96" rx="14" fill="#f5f7f5" stroke="#b9cdc0" stroke-width="1.5"/><text x="74" y="289.0" fill="#25392e" font-family="Arial, sans-serif" font-size="22">02  Assign your agent</text><text x="74" y="319.0" fill="#526459" font-family="Arial, sans-serif" font-size="16">NFT stays with its owner; the agent signs its own reservation.</text><rect x="54" y="387" width="812" height="96" rx="14" fill="#f5f7f5" stroke="#b9cdc0" stroke-width="1.5"/><text x="74" y="425.0" fill="#25392e" font-family="Arial, sans-serif" font-size="22">03  Receive a private delivery</text><text x="74" y="455.0" fill="#526459" font-family="Arial, sans-serif" font-size="16">NEAR AI response, evidence checks and buyer-bound encrypted artifact.</text><rect x="54" y="523" width="812" height="112" rx="14" fill="#e2f9ec" stroke="#b9cdc0" stroke-width="1.5"/><text x="74" y="561.0" fill="#25392e" font-family="Arial, sans-serif" font-size="22">04  Settle and keep the receipt</text><text x="74" y="591.0" fill="#526459" font-family="Arial, sans-serif" font-size="16">Manual: approve after review. Automatic: advance authorization.</text><text x="74" y="612.6" fill="#526459" font-family="Arial, sans-serif" font-size="16">Confirmed callback, then buy again, hand over or refund remainder.</text></svg>