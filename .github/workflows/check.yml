name: App checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    name: Rust, official NEAR build and Wasm Sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: contracts/proofbill
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain and native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libssl-dev libclang-dev libudev-dev
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --component rust-analyzer --target wasm32-unknown-unknown
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/proofbill/target
          key: contract-${{ runner.os }}-rust-1.99.1-${{ hashFiles('contracts/proofbill/Cargo.lock', 'contracts/proofbill/Cargo.toml') }}
          restore-keys: contract-${{ runner.os }}-rust-1.99.1-
      - name: Install checksum-pinned cargo-near 0.22.0
        run: |
          archive="$RUNNER_TEMP/cargo-near.tar.gz"
          curl --fail --silent --show-error --location https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-x86_64-unknown-linux-gnu.tar.gz --output "$archive"
          printf '%s  %s\n' 9429064e30a427e96523f539cb255f3688d2345e5000d7d4e4873a8247247d1a "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/cargo-near-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
      - run: cargo fmt -- --check
      - run: cargo test --lib --locked
      - run: cargo near build non-reproducible-wasm --locked
      - name: Exercise the built Wasm in Sandbox
        env:
          PROOFBILL_WASM: target/near/proofbill.wasm
        run: cargo test --test test_basics --locked -- --nocapture
      - name: Preserve Wasm and ABI build artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-wasm-and-abi
          path: contracts/proofbill/target/near/
          if-no-files-found: ignore
          retention-days: 7
  evidence:
    name: Buyer evidence verification and tamper rejection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r workers/inference/requirements.txt
      - run: python -m unittest discover -s workers/inference -p test_verify_export.py
  web:
    name: Typecheck, unit tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: queue_check
          POSTGRES_PASSWORD: queue_check_ci_only
          POSTGRES_DB: proofbill_queue_check
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U queue_check -d proofbill_queue_check"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:queue
        env:
          QUEUE_TEST_DATABASE_URL: postgres://queue_check:queue_check_ci_only@127.0.0.1:5432/proofbill_queue_check
      - run: pnpm test:recovery
        env:
          QUEUE_TEST_DATABASE_URL: postgres://queue_check:queue_check_ci_only@127.0.0.1:5432/proofbill_queue_check
      - run: pnpm test:retention
        env:
          QUEUE_TEST_DATABASE_URL: postgres://queue_check:queue_check_ci_only@127.0.0.1:5432/proofbill_queue_check
      - run: pnpm build
  browser:
    name: Browser journeys and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @proofbill/web exec playwright install --with-deps chromium
      - name: Test the production build without provider or wallet secrets
        run: pnpm --filter @proofbill/web exec playwright test --reporter=line,html
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-evidence
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
